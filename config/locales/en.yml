# Human-friendly names for model attributes. Rails uses these in error
# messages ("Amount due must be..." instead of "Rate kobo must be...") and in
# form labels when no explicit label text is given.
en:
  activerecord:
    attributes:
      vehicle:
        plate_number: "Plate number"
        vehicle_type: "Type"
        rate_kobo: "Amount due"
        rate_frequency: "How often"
        rest_days: "Rest days"
      driver:
        phone: "Phone number"
        guarantor_name: "Guarantor's name"
        guarantor_phone: "Guarantor's phone"
